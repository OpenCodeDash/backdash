name: Docker image

# Builds deploy/Dockerfile — the single image that bundles dash + backdash —
# and publishes it to the GitHub Container Registry as a package:
#
#   ghcr.io/opencodedash/backdash:latest      (and :master, :sha-<short>)
#   ghcr.io/opencodedash/backdash:<version>   (on a v* tag)
#
# The image bundles both repos, so the workflow checks dash out beside this
# repo and builds from the directory that holds the two of them (the build
# context deploy/Dockerfile.dockerignore expects).
on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    paths:
      - "deploy/**"
      - ".github/workflows/docker-publish.yml"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:
    inputs:
      dash-ref:
        description: "dash repo ref to bundle"
        required: false
        default: master

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout backdash
        uses: actions/checkout@v4
        with:
          path: backdash

      # Public repo; the default token can read it. The default branch is the
      # coupled default; override with the workflow_dispatch input when needed.
      - name: Checkout dash
        uses: actions/checkout@v4
        with:
          repository: OpenCodeDash/dash
          ref: ${{ inputs.dash-ref || 'master' }}
          path: dash

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backdash/deploy/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
