# Single-container deploy for OpenCode Dash: dash + backdash behind nginx.
#
#   cd backdash/deploy
#   docker compose up --build
#   open http://localhost:8080/            # dash
#   open http://localhost:8080/api/        # backdash health
#   open http://localhost:8080/api/docs    # backdash Swagger UI
#
# The build context is the workspace root so the image can build both repos.
services:
  ocd:
    build:
      context: ../..
      dockerfile: backdash/deploy/Dockerfile
      args:
        # dash calls the API and the opencode server on the same origin.
        VITE_BACKDASH_URL: /api
        VITE_OPENCODE_URL: /opencode
    image: ocd:local
    ports:
      - "${OCD_PORT:-8080}:8080"
    environment:
      DATABASE_PATH: /data/app.sqlite
      # Same-origin dash needs no CORS entry; add extra dash origins if you host
      # it elsewhere, comma-separated.
      BACKDASH_CORS_ORIGINS: ${BACKDASH_CORS_ORIGINS:-}
      # Where nginx proxies /opencode (must be reachable from the container).
      # Defaults to an opencode on the Docker host; point it at a remote host
      # (e.g. http://gigabox:4096) as needed. Runtime only — no rebuild.
      OPENCODE_UPSTREAM: ${OPENCODE_UPSTREAM:-http://host.docker.internal:4096}
      # Optional MCP server origin. Exposed at /mcp (NOT /api/mcp).
      MCP_UPSTREAM: ${MCP_UPSTREAM:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ocd-data:/data
    restart: unless-stopped

volumes:
  ocd-data:
