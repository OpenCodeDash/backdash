# Minimal nginx main config for the combined dash + backdash image.
# The server block lives in conf.d/app.conf, rendered from app.conf.template by
# entrypoint.sh (so BACKDASH_PORT can come from the environment).

user root;
worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 16m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # WebSocket-style upgrade passthrough (harmless for SSE).
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    include /etc/nginx/conf.d/*.conf;
}
